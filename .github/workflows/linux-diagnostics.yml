name: Diagnose ARM64 packaging
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/linux-diagnostics.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Linux runtime and tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          audio=libasound2
          minizip=libminizip1
          if [ "$(uname -m)" = aarch64 ]; then audio=libasound2t64; minizip=libminizip1t64; fi
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libfontconfig1 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 "$audio" "$minizip" libopus0 libwebp7 libwebpmux3 libwebpdemux2 libsnappy1v5 liblcms2-2 libxkbfile1 libgbm1 libxcb-dri3-0 binutils
          python -c "from PySide6 import QtWidgets, QtWebEngineCore; print('Qt loader ready')"
          arch=$(uname -m)
          python scripts/linux_tools.py --arch "$arch" --dest .runtime/linux
          echo "$PWD/.runtime/linux/bin" >> "$GITHUB_PATH"
          echo "CLIPFLOW_BIN_DIR=$PWD/.runtime/linux/bin" >> "$GITHUB_ENV"
          echo "QTIFW_BINARYCREATOR=$PWD/.runtime/linux/qtifw/bin/binarycreator" >> "$GITHUB_ENV"
      - name: Reproduce packaging failure (diagnostic only)
        shell: bash
        run: python scripts/build.py 2>&1 | tee work/native-build.log
      - name: Preserve diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARM64-build-diagnostic
          path: work/native-build.log
          if-no-files-found: error
          retention-days: 7
