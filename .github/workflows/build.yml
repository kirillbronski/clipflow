name: Build native Qt candidates
on:
  push:
    branches: [dev]
    paths:
      - 'src/clipflow/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'assets/**'
      - 'INSTALL.txt'
      - 'scripts/build.py'
      - 'scripts/package_config.py'
      - 'scripts/package_smoke.py'
      - 'packaging/linux/**'
      - 'scripts/linux_*.py'
      - 'scripts/installer_smoke.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Native package target (shared source checks still cover both OS)
        type: choice
        default: all
        options: [all, windows, macos, linux]
permissions:
  contents: read
jobs:
  package:
    name: Package · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.target == 'windows' && '["windows-latest"]' || inputs.target == 'macos' && '["macos-15"]' || inputs.target == 'all' && '["windows-latest","macos-15","ubuntu-22.04","ubuntu-24.04-arm"]' || '["ubuntu-22.04","ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Windows tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg innosetup --yes --no-progress
      - name: Resolve actual FFmpeg executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$binary) { throw 'Actual FFmpeg binary not found' }
          "CLIPFLOW_BIN_DIR=$($binary.DirectoryName)" >> $env:GITHUB_ENV
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Restore native ARM64 QtIFW
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        id: qtifw_cache
        uses: actions/cache/restore@v4
        with:
          path: .runtime/linux/qtifw
          key: qtifw-4.11.0-qt6.7.2-ubuntu24-arm64-${{ hashFiles('scripts/linux_qtifw.py') }}
      - name: Install Linux runtime and tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          audio=libasound2
          minizip=libminizip1
          if [ "$(uname -m)" = aarch64 ]; then audio=libasound2t64; minizip=libminizip1t64; fi
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libfontconfig1 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 "$audio" "$minizip" libopus0 libwebp7 libwebpmux3 libwebpdemux2 libsnappy1v5 liblcms2-2 libxkbfile1 libgbm1 libxcb-dri3-0 binutils
          python -c "from PySide6 import QtWidgets, QtWebEngineCore; print('Qt loader ready')"
          arch=$(uname -m)
          if [ "$arch" = aarch64 ]; then
            sudo apt-get install -y build-essential cmake ninja-build zlib1g-dev liblzma-dev libbz2-dev libssl-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-util-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev
          fi
          mkdir -p work
          python scripts/linux_tools.py --arch "$arch" --dest .runtime/linux 2>&1 | tee work/linux-tools.log
          echo "$PWD/.runtime/linux/bin" >> "$GITHUB_PATH"
          echo "CLIPFLOW_BIN_DIR=$PWD/.runtime/linux/bin" >> "$GITHUB_ENV"
          echo "QTIFW_BINARYCREATOR=$PWD/.runtime/linux/qtifw/bin/binarycreator" >> "$GITHUB_ENV"
      - name: Cache verified native ARM64 QtIFW
        if: runner.os == 'Linux' && runner.arch == 'ARM64' && steps.qtifw_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .runtime/linux/qtifw
          key: qtifw-4.11.0-qt6.7.2-ubuntu24-arm64-${{ hashFiles('scripts/linux_qtifw.py') }}
      - name: Qt regression and coverage gates
        run: python scripts/check.py --qt
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build and smoke native package
        if: runner.os != 'Linux'
        run: python scripts/build.py
      - name: Build and smoke Linux package with diagnostic log
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/build.py 2>&1 | tee work/native-build.log
      - name: Linux build diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Build-log-${{ matrix.os }}
          path: |
            work/native-build.log
            work/linux-tools.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Candidate artifacts and native proof
        uses: actions/upload-artifact@v4
        with:
          name: ClipFlow-${{ matrix.os }}
          path: |
            outputs/**/ClipFlow-Setup-*.exe
            outputs/**/ClipFlow-*-Windows-x64-portable.zip
            outputs/**/ClipFlow-*-macOS-arm64.dmg
            outputs/**/ClipFlow-*-macOS-app.zip
            outputs/**/ClipFlow-*-Linux-*-Setup.run
            outputs/**/ClipFlow-*-Linux-*-portable.tar.gz
            outputs/**/installer-report.json
            outputs/**/INSTALL.txt
            outputs/**/package-report.json
            outputs/**/build-report.json
            outputs/**/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Coverage proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coverage-package-${{ matrix.os }}
          path: work/verification/*.json
          retention-days: 14
