name: Build Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Install FFmpeg and Inno Setup
        run: choco install ffmpeg innosetup --yes --no-progress
      - name: Use actual FFmpeg binaries instead of Chocolatey shims
        shell: pwsh
        run: |
          $binary = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$binary) { throw 'FFmpeg binary not found' }
          "CLIPFLOW_BIN_DIR=$($binary.DirectoryName)" >> $env:GITHUB_ENV
      - run: python scripts/check.py
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ClipFlow-Windows
          path: |
            outputs/ClipFlow-Setup-*.exe
            outputs/ClipFlow-*-Windows-x64-portable.zip
          retention-days: 14
