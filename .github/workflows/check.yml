name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Python 3.12 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: python scripts/check.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Native Qt clipboard DPI history and shutdown on Windows
        if: runner.os == 'Windows'
        run: python -m pytest tests/ui/test_themes.py tests/platform/test_qt_clipboard.py tests/ui/test_history_actions.py tests/integration/test_shutdown_recovery.py -q
        env:
          QT_QPA_PLATFORM: windows
          CLIPFLOW_NATIVE_QA: '1'
      - name: Native Qt clipboard DPI history and shutdown on macOS
        if: runner.os == 'macOS'
        run: python -m pytest tests/ui/test_themes.py tests/platform/test_qt_clipboard.py tests/ui/test_history_actions.py tests/integration/test_shutdown_recovery.py -q
        env:
          QT_QPA_PLATFORM: cocoa
          CLIPFLOW_NATIVE_QA: '1'
      - name: Native protected auth and embedded browser on Windows
        if: runner.os == 'Windows'
        run: python -m pytest tests/platform/test_auth_compatibility.py tests/ui/test_accounts.py -q
        env:
          QT_QPA_PLATFORM: windows
          CLIPFLOW_AUTH_NATIVE: '1'
      - name: Native protected auth and embedded browser on macOS
        if: runner.os == 'macOS'
        run: python -m pytest tests/platform/test_auth_compatibility.py tests/ui/test_accounts.py -q
        env:
          QT_QPA_PLATFORM: cocoa
          CLIPFLOW_AUTH_NATIVE: '1'
