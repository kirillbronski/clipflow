[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipflow-app"
version = "2.0.0.dev0"
description = "Cross-platform ClipFlow desktop downloader"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-qt==4.5.0", "pytest-cov==7.1.0"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/ui", "tests/platform"]
addopts = "-ra"
qt_api = "pyside6"

[tool.coverage.run]
branch = true
source = ["clipflow"]

[tool.coverage.report]
show_missing = true
skip_empty = true
