[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipflow-app"
description = "Cross-platform ClipFlow desktop downloader"
requires-python = ">=3.12"
dynamic = ["dependencies", "version"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-qt==4.5.0", "pytest-cov==7.1.0", "ruff==0.17.3"]

[tool.setuptools.dynamic]
version = {attr = "clipflow.version.APP_VERSION"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/ui", "tests/platform"]
addopts = "-ra"
qt_api = "pyside6"
markers = ["native_gui: requires an explicitly enabled real Windows/Cocoa GUI session"]

[tool.coverage.run]
branch = true
source = ["clipflow"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C90", "BLE"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported into test modules and used only as parameter names.
"tests/**" = ["F401", "F811"]
# One message per line keeps the RU/EN catalogue greppable; QSS keeps one rule per line.
"src/clipflow/ui/i18n.py" = ["E501"]
"src/clipflow/ui/themes.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Qt models take parent=QModelIndex() by convention; the default is never mutated.
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]
